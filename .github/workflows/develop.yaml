name: CI Develop
on:
  push:
    branches:
      - 'develop/**'
jobs:
  pipeline:
    runs-on: [self-hosted, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run basic command
        run: echo "Pipeline is running successfully on develop!"

      - name: Show Docker version
        run: docker --version

      - name: Build with Gradle and JaCoCo
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/home/gradle/project -w /home/gradle/project gradle:8.14-jdk17 gradle build test jacocoTestReport

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: build/reports/jacoco/
          retention-days: 30

      - name: Generate PDF documentation
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/data pandoc/extra documentation.md -o documentation.pdf
        working-directory: docs

      - name: Upload documentation PDF
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdf
          path: docs/documentation.pdf
          retention-days: 30

      - name: Verify SonarQube secrets
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "ERROR: SONAR_TOKEN secret is not configured!"
            exit 1
          fi
          if [ -z "${{ secrets.SONAR_HOST_URL }}" ]; then
            echo "ERROR: SONAR_HOST_URL secret is not configured!"
            exit 1
          fi

      - name: SonarQube Analysis (CLI)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SCANNEROPTS: >-
            -Dsonar.projectKey=team6
            -Dsonar.projectName=team6
            -Dsonar.sources=src/main
            -Dsonar.java.libraries=build/libs
            -Dsonar.java.binaries=build/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
            -Dsonar.junit.reportsPath=build/test-results
        run: |
          docker run --rm \
            -e SONAR_HOST_URL="${SONAR_HOST_URL}" \
            -e SONAR_TOKEN="${SONAR_TOKEN}" \
            -e SONAR_SCANNER_OPTS="${SCANNEROPTS}" \
            -v "${PWD}:/usr/src" \
            sonarsource/sonar-scanner-cli
