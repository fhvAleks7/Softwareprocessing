name: CI Main

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, deploy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run basic command
        run: echo "Deploying on main!"

      - name: Show Docker version
        run: docker --version

      - name: Run Docker container
        run: docker run hello-world