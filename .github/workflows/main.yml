name: CI Release

on:
  push:
    branches:
      - 'main'

jobs:
  pipeline:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run basic command
        run: echo "Pipeline is running successfully on release!"

      - name: Show Docker version
        run: docker --version

      - name: Run Docker container
        run: docker run hello world
