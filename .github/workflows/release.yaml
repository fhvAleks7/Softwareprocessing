name: CI Release

on:
  push:
    branches:
      - 'release/**'

jobs:
  build:
    runs-on: [self-hosted, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t demo .

      - name: Tag image for registry
        run: docker image tag demo 10.0.40.169:5000/team6/demo:latest

      - name: Push image to registry
        run: docker image push 10.0.40.169:5000/team6/demo:latest

  deploy:
      runs-on: [self-hosted, deploy]
      needs: build
      steps:
        - name: Pull image from registry
          run: docker image pull 10.0.40.169:5000/team6/demo:latest

        - name: Remove old container if exists
          run: docker rm -f demo || true

        - name: Tag Docker image
          run: ls build/libs

        - name: Display JaCoCo coverage summary
          run: |
            echo "📊 JaCoCo Coverage Report Generated:"
            ls -lh build/reports/jacoco/test/jacocoTestReport.xml
            echo "✅ Report is ready for deployment"

        - name: Upload JaCoCo coverage report
          uses: actions/upload-artifact@v4
          if: always()
          with:
            name: jacoco-coverage-report
            path: build/reports/jacoco/test/
            retention-days: 30
            
        - name: Run application
          run: docker run -d -p 8086:8080 --name demo 10.0.40.169:5000/team6/demo:latest
