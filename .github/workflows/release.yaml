name: CI Release

on:
  push:
    branches:
      - 'release/**'

jobs:
  pipeline:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run basic command
        run: echo "Pipeline is running successfully on release!"

      - name: Show Docker version
        run: docker --version

      - name: Build Docker image
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/home/gradle/project -w /home/gradle/project gradle:latest gradle build

      - name: Tag Docker image
        run: ls build/libs

      - name: Display JaCoCo coverage summary
        run: |
          echo "📊 JaCoCo Coverage Report Generated:"
          ls -lh build/reports/jacoco/test/jacocoTestReport.xml
          echo "✅ Report is ready for deployment"

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/
          retention-days: 30