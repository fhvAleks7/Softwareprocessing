name: CI Release

on:
  push:
    branches:
      - 'release/**'

jobs:
  build:
    runs-on: [self-hosted, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate PDF documentation
        run: |
          docker run --rm \
            -v $(pwd)/docs:/data \
            pandoc/latex:latest \
            documentation.md -o documentation.pdf

      - name: Upload documentation PDF
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/documentation.pdf

      - name: Run tests and generate coverage report
        run: ./gradlew test jacocoTestReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/

      - name: Build Docker image
        run: docker build -t demo .

      - name: Tag image for registry
        run: docker image tag demo 10.0.40.169:5000/team6/demo:latest

      - name: Push image to registry
        run: docker image push 10.0.40.169:5000/team6/demo:latest

  deploy:
      runs-on: [self-hosted, deploy]
      needs: build
      steps:
        - name: Pull image from registry
          run: docker image pull 10.0.40.169:5000/team6/demo:latest

        - name: Remove old container if exists
          run: docker rm -f demo || true

        - name: Run application
          run: docker run -d -p 8086:8080 --name demo 10.0.40.169:5000/team6/demo:latest